[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
worldchain = "${WORLDCHAIN_RPC_URL}"
worldchain_sepolia = "https://worldchain-sepolia.g.alchemy.com/public"
